name: motologger
description: "High-performance motorcycle telemetry dashboard for Android Auto and Apple CarPlay"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Bluetooth Low Energy
  flutter_blue_plus: ^1.34.5

  # GPS & Location Services
  geolocator: ^13.0.1

  # Local Database & Storage (100% Offline / Serverless)
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Telemetry Charts & Visualization
  fl_chart: ^0.70.0

  # Formatting & Sharing
  intl: ^0.19.0
  share_plus: ^10.1.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
